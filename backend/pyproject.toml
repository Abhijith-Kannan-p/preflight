[project]
name = "preflight-backend"
version = "0.1.0"
description = "Preflight: pre-publication brand-governance review engine"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.mypy]
# Runtime target is 3.11; 3.12 here only lets mypy parse numpy's newer stub syntax.
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
